name: fuelwise
description: "Offline-first ethanol vs gasoline comparator."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  decimal: 3.2.6
  rational: 2.2.3
  intl: 0.20.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.2
  shared_preferences: 2.5.5
  drift: 2.34.3
  sqlite3_flutter_libs: 0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0
  flutter_launcher_icons: 0.14.4
  build_runner: 2.16.0
  drift_dev: 2.34.5

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
