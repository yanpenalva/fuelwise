services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        UID: "1000"
        GID: "1000"
    image: fuelwise-dev
    volumes:
      - .:/workdir
      - pub_cache:/opt/flutter/.pub-cache
      - android_debug_keystore:/home/dev/.android
    working_dir: /workdir
    stdin_open: true
    tty: true
    environment:
      ANDROID_ADB_SERVER_ADDRESS: host.docker.internal
      ANDROID_ADB_SERVER_PORT: "5037"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  apk-server:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/index.html:/usr/share/nginx/html/index.html:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./build/app/outputs/flutter-apk:/srv/apk:ro

volumes:
  pub_cache:
  android_debug_keystore:
